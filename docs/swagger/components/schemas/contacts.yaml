type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  email:
    description: "Contact's age"
    type: string
    example: john@example.com
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+3801234567'
  isFavourite:
    description: 'Add contact to favourite or not'
    type: boolean
    example: false
  photo:
    description: "Link to student's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
