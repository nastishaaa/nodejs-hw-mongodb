type: object
required:
  - userId
  - name
  - email
  - password
properties:
  userId:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "User's name"
    type: string
    example: 'John Doe'
  email:
    description: "User's email"
    type: string
    example: john@example.com
  password:
    description: "User's password"
    type: string
    example: 'qwerty123'
