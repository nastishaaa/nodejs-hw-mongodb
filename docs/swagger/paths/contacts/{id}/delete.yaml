tags:
  - Contacts
summary: Delete a contact by ID
operationId: deleteContact
description: This operation deletes a contact from the database using the contact's unique ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    description: ID of the contact to delete
    schema:
      type: string
responses:
  '204':
    description: Contact deleted successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
          properties:
            status:
              type: integer
              example: 204
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
