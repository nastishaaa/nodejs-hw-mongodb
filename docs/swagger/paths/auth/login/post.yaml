tags:
  - Auth
summary: Login user
operationId: loginUser

description: Log in an existing user with email and password.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            format: email
            example: john@example.com
          password:
            description: "User's password"
            type: string
            format: password
            example: 'qwerty123'
responses:
  '200':
    description: Successfully logged in a user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in!
            data:
              $ref: ../../../components/schemas/auth.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
