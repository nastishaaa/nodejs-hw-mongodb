tags:
  - Auth
summary: Registered user
operationId: registerUser
description: 'Create a user with payload'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: john@example.com
          password:
            description: "User's password"
            type: string
            example: 'qwerty123'
responses:
  '201':
    description: Registered a user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              $ref: ../../../components/schemas/auth.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
